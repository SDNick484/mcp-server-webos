name: Hardware report
description: What worked (and didn't) on your LG TV. Reports that everything worked are just as useful.
title: "Hardware report: <model>, webOS <version>"
labels: ["hardware-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. This server has run on three LG TVs (a 2017 C7, a 2021 G1 and a 2025 C5); other
        models and webOS versions have only run against a simulator. Each report moves an assumption in
        `assumptions.py` from "simulator-only" to confirmed or disproved, or adds a model to the list.

        **Before pasting anything:** `doctor` and `capture` mask IP addresses, MACs, serials and UUIDs by
        default and never show client keys (don't use `--no-redact` here).
  - type: input
    id: tv
    attributes:
      label: TV model
      description: e.g. "OLED65C3PUA". The year helps if you know it.
    validations:
      required: true
  - type: input
    id: webos
    attributes:
      label: webOS version
      description: "`webos_get_status` or `doctor` reports it (e.g. 6.5.3, or 25 / 26 on 2025 models)."
    validations:
      required: true
  - type: input
    id: sound
    attributes:
      label: Where the sound goes
      description: TV speakers, a soundbar or receiver over HDMI ARC/eARC, optical, Bluetooth, ...
  - type: input
    id: platform
    attributes:
      label: Where mcp-server-webos runs
      description: OS, Python version, and how it's run (stdio from Claude Desktop/Code, uvx, the Alpine service, ...)
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`mcp-server-webos doctor` output"
      description: Run it with the same settings the server uses.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: worked
    attributes:
      label: What worked
      description: Tick what you tried and saw work on the TV. Leave the rest unticked and say what happened below.
      options:
        - label: "`discover` found the TV (SSDP)"
        - label: "`pair` showed the dialog on the TV, and later connections didn't ask again"
        - label: get_status shows the right power state, app or input, and volume
        - label: set_power off turns the TV off, and set_power on wakes it again (Wake-on-LAN)
        - label: set_screen off blanks the picture with sound still playing, and on brings it back
        - label: list_sources / select_source open the right apps and HDMI inputs
        - label: send_key and media_control do what the remote would
        - label: insert_text / search_app type into the TV's on-screen keyboard
        - label: set_volume / set_mute work (or are refused, when a receiver owns the volume)
        - label: After the TV was off or off the network for a while, the server reconnects on its own
  - type: textarea
    id: details
    attributes:
      label: What didn't work, or surprised you
      description: |
        What you asked for, what happened, and the tool's reply. If you followed HARDWARE_VALIDATION.md,
        say which steps passed. A `capture --tv <name> --profile <closest> --out captures/` file (redacted) is very welcome:
        it becomes a contract test for your model.
